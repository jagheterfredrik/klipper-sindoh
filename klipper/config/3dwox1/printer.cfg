# =====================================================================
# Sindoh 3DWOX 1 - YOUR printer.cfg
# =====================================================================
# The hardware definition and the macros come from the two included files,
# which updates replace. This file is yours and is never overwritten:
# - put your own changes and overrides here (a section repeated here adds
#   to / overrides the included one);
# - the per-printer values below are written by calibration commands, then
#   SAVE_CONFIG (which only works for options that are NOT in an include).
# =====================================================================

[include dp200_printer.cfg]
[include dp200_macros.cfg]

# --- per-printer calibration -----------------------------------------
# Values of the first 3DWOX 1 (2026-11-12/13). Calibrate your own printer
# and SAVE_CONFIG; the motor currents follow the stock karas.db (below).
# Motor current reference. This unit's stock karas.db has MOTOR_PWM_{X,Y,Z,E}OFFSET = 99 (the
# firmware's factory default, range -99..99; the DP200 unit had -15/+15/+30/+50), so stock drives the
# A4982/TMC2224 REF at (100 + 99) / 200 = 0.995. The DP200 values (0.425 .. 0.75) are far too low here.
[output_pin motor_current_x]
value: 0.995
shutdown_value: 0.995

[output_pin motor_current_y]
value: 0.995
shutdown_value: 0.995

[output_pin motor_current_z]
value: 0.995
shutdown_value: 0.995

[output_pin motor_current_e]
value: 0.995
shutdown_value: 0.995

[printer]
# Slower than the DP200 defaults (210 mm/s, 1500 mm/s2; Z 5 mm/s, 100 mm/s2):
# on this 3DWOX 1 the default X/Y homing was too violent and Z stalled.
max_accel: 500
max_z_velocity: 3
max_z_accel: 20

[stepper_x]
homing_speed: 50

[stepper_y]
homing_speed: 50

[stepper_z]
# Z switch height above the bed: paper test (LV_PROBE_CALIBRATE) or
# Z_ENDSTOP_CALIBRATE. First 3DWOX 1: 2.725.
position_endstop: 2.725
homing_speed: 3

[probe]
# Pin position relative to the nozzle (measure with a ruler): the pin sits
# front-right of the nozzle (front = lower Y). DP200 values; not yet
# re-measured on a 3DWOX 1.
x_offset: 23.5   # measured 2026-10-27 on the test printer (printed pad + probe scan)
y_offset: -28.0
# Pin tip below the nozzle: LV_PROBE_CALIBRATE -> paper test -> ACCEPT ->
# LV_PROBE_CALIBRATE_SAVE Z=<accepted> -> SAVE_CONFIG. First 3DWOX 1: 2.711.
z_offset: 2.711

[extruder]
# Gains measured on the first 3DWOX 1 (2026-11-12, 210 C, max_power 0.6).
# Run PID_CALIBRATE HEATER=extruder TARGET=210, then SAVE_CONFIG, for your own printer.
control: pid
pid_Kp: 14.565
pid_Ki: 1.566
pid_Kd: 33.865

[heater_bed]
# DP200 gains (2026-10-21, 60 C, max_power 1.0); not yet calibrated on a 3DWOX 1.
# Run PID_CALIBRATE HEATER=heater_bed TARGET=60, then SAVE_CONFIG, for your own printer.
control: pid
pid_Kp: 74.532
pid_Ki: 1.252
pid_Kd: 1109.592

# PRINT_START makes no mesh by default (MESH_ADAPTIVE from the slicer, or
# MESH=4): load the saved "default" mesh at start-up, when there is one.
[delayed_gcode load_bed_mesh]
initial_duration: 2
gcode:
    {% if 'default' in printer.bed_mesh.profiles %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}
